<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>He Who Promised Is Faithful</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            min-height: 100%;
        }

        body {
            background: #111a15;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;
            font-family: Georgia, "Times New Roman", serif;
        }

        .book-cover {
            width: min(100%, 600px);
            aspect-ratio: 2 / 3;
            position: relative;
            overflow: hidden;

            background:
                radial-gradient(
                    circle at 50% 35%,
                    rgba(37, 91, 62, 0.45),
                    transparent 45%
                ),
                linear-gradient(
                    145deg,
                    #07140d 0%,
                    #123b26 48%,
                    #07140d 100%
                );

            border: 2px solid #b89445;

            box-shadow:
                0 0 0 7px #18251d,
                0 0 0 9px #8f7132,
                0 25px 60px rgba(0,0,0,0.55);

            color: #d8b968;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            padding: 13% 10%;
        }

        .inner-border {
            position: absolute;
            inset: 18px;
            border: 1px solid rgba(216, 185, 104, 0.55);
            pointer-events: none;
        }

        .top-ornament {
            font-size: 22px;
            letter-spacing: 8px;
            margin-bottom: 11%;
            opacity: 0.9;
        }

        .title {
            font-size: clamp(30px, 7vw, 58px);
            line-height: 1.05;
            font-weight: normal;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin: 0;
            text-shadow: 0 2px 12px rgba(0,0,0,0.45);
        }

        .title-divider {
            width: 110px;
            height: 1px;
            background: #c9a954;
            margin: 9% 0;
        }

        .subtitle {
            max-width: 420px;
            font-size: clamp(13px, 2.4vw, 19px);
            line-height: 1.65;
            font-style: italic;
            color: #eee0b8;
            margin: 0;
        }

        .bottom-area {
            margin-top: auto;
        }

        .faith-line {
            font-size: 12px;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: #bfa15a;
        }

        .bottom-ornament {
            margin-top: 18px;
            font-size: 18px;
            letter-spacing: 7px;
        }

        @media (max-width: 500px) {
            body {
                padding: 15px;
            }

            .inner-border {
                inset: 12px;
            }

            .book-cover {
                padding: 14% 9%;
            }
        }
    </style>
</head>

<body>

    <main class="book-cover">

        <div class="inner-border"></div>

        <div class="top-ornament">
            ✦ ✦ ✦
        </div>

        <h1 class="title">
            He Who<br>
            Promised<br>
            Is Faithful
        </h1>

        <div class="title-divider"></div>

        <p class="subtitle">
            The Journey of Waiting, Trusting,
            and Seeing God Fulfill His Promise
        </p>

        <div class="bottom-area">

            <div class="faith-line">
                A Journey of Faith, Hope &amp; Promise
            </div>

            <div class="bottom-ornament">
                ✦
            </div>

        </div>

    </main>

</body>
</html>
